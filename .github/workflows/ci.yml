name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    # Self-hosted since 2026-09-01: org billing block — GitHub-hosted jobs
    # (ubuntu-latest) stop starting entirely ("recent account payments have
    # failed or your spending limit needs to be increased" — fail in ~2s with
    # zero steps). Moved to the org self-hosted Linux fleet (neovm runners,
    # labels verified 2026-09-01), same migration as the other org repos.
    runs-on: [self-hosted, Linux, X64, nas, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest -q
