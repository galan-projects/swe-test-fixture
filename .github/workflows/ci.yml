name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: [self-hosted, Linux, X64, nas, prod]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest
      - run: python -m pytest -q
